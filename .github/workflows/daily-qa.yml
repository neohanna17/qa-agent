name: Daily QA Smoke Tests

on:
  schedule:
    - cron: '0 5 * * *'   # Daily smoke test — 5am UTC (8am Israel IDT/UTC+3)
    - cron: '0 7 * * 1'   # Weekly flow test — Mondays 7am UTC
  workflow_dispatch:
    inputs:
      site_id:
        description: 'Single site ID (leave empty for all)'
        required: false
        default: ''
      test_type:
        description: 'Test type: smoke or flow (default: smoke)'
        required: false
        default: 'smoke'

jobs:
  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
      - run: npx playwright install chromium --with-deps
      - name: Run smoke tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          SINGLE_SITE: ${{ github.event.inputs.site_id || '' }}
          SCHEDULE: ${{ github.event.schedule || '' }}
          TEST_TYPE: ${{ github.event.inputs.test_type || 'smoke' }}
        run: |
          if [ "$TEST_TYPE" = "flow" ] && [ "$SCHEDULE" != "0 5 * * *" ]; then
            echo "Skipping smoke tests — test_type is flow"
          else
            node scripts/smoke-test.js
          fi

  flow-test:
    name: Flow Tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
      - run: npx playwright install chromium --with-deps
      - name: Run flow tests
        env:
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          SINGLE_SITE: ${{ github.event.inputs.site_id || '' }}
          SCHEDULE: ${{ github.event.schedule || '' }}
          TEST_TYPE: ${{ github.event.inputs.test_type || 'smoke' }}
        run: |
          if [ "$TEST_TYPE" = "flow" ] || [ "$SCHEDULE" = "0 7 * * 1" ]; then
            node scripts/flow-test.js
          else
            echo "Skipping flow tests — test_type is smoke"
          fi
