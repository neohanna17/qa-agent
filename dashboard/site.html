<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Detail — QA Dashboard</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap");
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f0f14;color:#e2e2ef;font-family:Inter,system-ui,sans-serif;font-size:13px;min-height:100vh;line-height:1.5}
a{color:#818cf8;text-decoration:none} a:hover{text-decoration:underline}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:#0f0f14}::-webkit-scrollbar-thumb{background:#2d2d3f;border-radius:3px}
.topnav{background:#0a0a0f;border-bottom:1px solid #1e1e2e;padding:12px 24px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:50;flex-wrap:wrap}
.back-btn{display:flex;align-items:center;gap:6px;color:#6b7280;font-size:12px;padding:5px 10px;border:1px solid #1e1e2e;border-radius:6px;cursor:pointer;background:transparent;transition:all .15s;white-space:nowrap}
.back-btn:hover{border-color:#3d3d52;color:#e2e2ef}
.nav-title{font-weight:600;font-size:14px;white-space:nowrap}
.nav-status{margin-left:auto}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;padding:3px 9px;border-radius:20px;letter-spacing:.04em}
.badge-pass{background:#16543020;color:#4ade80;border:1px solid #4ade8040}
.badge-fail{background:#5c111120;color:#f87171;border:1px solid #f8717140}
.badge-warn{background:#78350f20;color:#fbbf24;border:1px solid #fbbf2440}
.badge-info{background:#1e3a5f20;color:#60a5fa;border:1px solid #60a5fa40}
.wrap{max-width:1100px;margin:0 auto;padding:24px 24px 60px}
.hero{background:linear-gradient(135deg,#13131f,#16162a);border:1px solid #1e1e2e;border-radius:14px;padding:24px 28px;margin-bottom:20px;display:flex;align-items:flex-start;gap:20px;flex-wrap:wrap}
.hero-left{flex:1;min-width:200px}
.hero-title{font-size:24px;font-weight:700;margin-bottom:4px}
.hero-url{color:#6b7280;font-size:12px;margin-bottom:12px}
.hero-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:#6b7280;align-items:center}
.hero-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px}
.stat-card{background:#13131f;border:1px solid #1e1e2e;border-radius:10px;padding:14px 16px}
.stat-label{font-size:10px;color:#4b5563;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.stat-value{font-size:20px;font-weight:700}
.stat-sub{font-size:10px;color:#4b5563;margin-top:2px}
.stat-bar{height:3px;background:#1e1e2e;border-radius:2px;margin-top:8px;overflow:hidden}
.stat-bar-fill{height:100%;border-radius:2px}
.section{background:#13131f;border:1px solid #1e1e2e;border-radius:12px;margin-bottom:16px;overflow:hidden}
.section-hdr{padding:14px 18px;border-bottom:1px solid #1a1a2a;display:flex;align-items:center;justify-content:space-between}
.section-title{font-weight:600;font-size:13px}
.section-body{padding:16px 18px}
.check-item{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:7px;transition:background .1s}
.check-item:hover{background:#1a1a2a}
.check-icon{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:10px;font-weight:700;margin-top:1px}
.ci-pass{background:#16543030;color:#4ade80}
.ci-fail{background:#5c111130;color:#f87171}
.check-name{flex:1;font-size:12px;line-height:1.4}
.check-detail{font-size:11px;color:#6b7280;text-align:right;max-width:280px;word-break:break-all;line-height:1.4}
.check-url-lnk{font-size:10px;color:#818cf8;display:block;margin-top:2px}
.issues-panel{background:#1a0a0a;border:1px solid #f8717120;border-radius:10px;padding:14px 16px;margin-bottom:16px}
.issues-title{color:#f87171;font-weight:600;font-size:12px;margin-bottom:10px}
.issue-row{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid #2a1010;align-items:flex-start}
.issue-row:last-child{border:none;padding-bottom:0}
.issue-arr{color:#f87171;flex-shrink:0;font-size:13px;margin-top:1px}
.issue-body{flex:1}
.issue-text{font-size:11px;color:#fca5a5;line-height:1.5}
.issue-lnk{display:inline-block;font-size:10px;color:#818cf8;margin-top:3px}
.ss-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.ss-card{background:#0f0f14;border:1px solid #1e1e2e;border-radius:8px;overflow:hidden;cursor:pointer;transition:border-color .15s}
.ss-card:hover{border-color:#3d3d52}
.ss-lbl{padding:8px 12px;font-size:11px;color:#6b7280;border-bottom:1px solid #1e1e2e;display:flex;align-items:center;justify-content:space-between}
.ss-img{width:100%;display:block;max-height:180px;object-fit:cover;object-position:top}
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:200;align-items:center;justify-content:center;cursor:zoom-out;padding:20px}
.lightbox.open{display:flex}
.lightbox img{max-width:90vw;max-height:90vh;border-radius:6px;object-fit:contain}
.ai-block{background:#0d1526;border:1px solid #1e3a5f40;border-radius:8px;padding:14px 16px}
.ai-lbl{color:#60a5fa;font-size:10px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
.ai-desc{font-size:12px;color:#e2e2ef;line-height:1.7;margin-bottom:10px}
.ai-row{display:flex;align-items:flex-start;gap:8px;font-size:11px;padding:5px 0;border-bottom:1px solid #1e3a5f20}
.ai-row:last-child{border:none}
.ai-ri{flex-shrink:0;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;margin-top:1px}
.ai-rn{width:180px;flex-shrink:0;color:#e2e2ef}
.ai-rno{flex:1;color:#8080a0;line-height:1.4}
.pages-row{display:flex;flex-wrap:wrap;gap:8px}
.page-pill{background:#1a1a2a;border:1px solid #2d2d3f;border-radius:20px;padding:5px 12px;font-size:11px;color:#a0a0b8}
.hist-item{display:flex;align-items:center;gap:12px;padding:9px 6px;border-bottom:1px solid #1a1a2a;font-size:11px;cursor:pointer;border-radius:6px;transition:background .1s}
.hist-item:last-child{border:none}
.hist-item:hover{background:#1a1a2a}
.hist-date{color:#6b7280;width:85px;flex-shrink:0}
.hist-bar{flex:1;background:#1e1e2e;border-radius:2px;height:4px;overflow:hidden;display:flex}
.loading{display:flex;align-items:center;justify-content:center;min-height:60vh;flex-direction:column;gap:12px;color:#4b5563}
.spinner{width:32px;height:32px;border:2px solid #1e1e2e;border-top-color:#818cf8;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.no-data{text-align:center;padding:60px 20px;color:#4b5563}
@media(max-width:640px){
  .hero{flex-direction:column}.hero-right{align-items:flex-start}
  .stat-row{grid-template-columns:repeat(2,1fr)}
  .ss-grid{grid-template-columns:1fr}
  .wrap{padding:16px 14px 40px}
  .check-detail{max-width:140px}
  .ai-rn{width:120px}
}
</style>
</head>
<body>
<nav class="topnav">
  <button class="back-btn" onclick="goBack()">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
    All Sites
  </button>
  <div class="nav-title" id="navName">Loading&#8230;</div>
  <div class="nav-status" id="navStatus"></div>
</nav>
<div id="mainContent"><div class="loading"><div class="spinner"></div><span>Loading site data&#8230;</span></div></div>
<div class="lightbox" id="lightbox" onclick="this.classList.remove('open')"><img id="lbImg" src="" alt="Screenshot"></div>
<script>
firebase.initializeApp({databaseURL:"https://qa-tracker-73b87-default-rtdb.firebaseio.com"});
const db=firebase.database();
const params=new URLSearchParams(location.search);
const siteId=params.get("id")||params.get("site")||"";
const dateParam=params.get("date")||"";
const testType=params.get("type")||"smoke";

function goBack(){
  window.location.href="index.html"+(dateParam?"?date="+encodeURIComponent(dateParam):"");
}
function e(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function fmt(ms){return ms>=1000?(ms/1000).toFixed(1)+"s":ms+"ms";}
function fmtDt(ts){try{return new Date(ts).toLocaleString("en-GB",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});}catch(x){return ts;}}

function statCard(lbl,val,sub,pct,col){
  const w=Math.min(100,Math.max(0,pct||0));
  return "<div class=\"stat-card\">"
    +"<div class=\"stat-label\">"+e(lbl)+"</div>"
    +"<div class=\"stat-value\" style=\"color:"+col+"\">"+e(String(val))+"</div>"
    +"<div class=\"stat-sub\">"+e(String(sub||""))+"</div>"
    +"<div class=\"stat-bar\"><div class=\"stat-bar-fill\" style=\"width:"+w+"%;background:"+col+"30\"></div></div>"
    +"</div>";
}

function checkItem(name,detail,pass,url){
  const icon=pass
    ?"<div class=\"check-icon ci-pass\">&#10003;</div>"
    :"<div class=\"check-icon ci-fail\">&#10007;</div>";
  const urlHtml=url?"<a class=\"check-url-lnk\" href=\""+e(url)+"\" target=\"_blank\">"+e(url)+"</a>":"";
  return "<div class=\"check-item\">"+icon
    +"<div class=\"check-name\">"+e(name)+"</div>"
    +"<div class=\"check-detail\">"+e(detail)+(urlHtml?"<br>"+urlHtml:"")+"</div>"
    +"</div>";
}

function issueRow(text,url){
  const lnk=url?"<a class=\"issue-lnk\" href=\""+e(url)+"\" target=\"_blank\">" + e(url)+"</a>":"";
  return "<div class=\"issue-row\"><span class=\"issue-arr\">&#8594;</span>"
    +"<div class=\"issue-body\"><div class=\"issue-text\">"+e(text)+"</div>"+lnk+"</div>"
    +"</div>";
}

function openLightbox(src){
  document.getElementById("lbImg").src=src;
  document.getElementById("lightbox").classList.add("open");
}

async function loadSite(){
  if(!siteId){
    document.getElementById("mainContent").innerHTML="<div class=\"no-data wrap\">No site ID provided. <a href=\"index.html\">Back to dashboard</a></div>";
    return;
  }
  let date=dateParam;
  if(!date){
    const sn=await db.ref("autoLatest").get();
    date=(sn.val()||{}).date||new Date().toISOString().split("T")[0];
  }
  const path=testType==="flow"?"flowResults":"autoResults";
  const sn=await db.ref(path+"/"+date+"/"+siteId).get();
  let data=sn.val();
  if(!data&&testType==="smoke"){
    const ls=await db.ref("autoLatest").get();
    const ld=(ls.val()||{}).date;
    if(ld&&ld!==date){
      const s2=await db.ref("autoResults/"+ld+"/"+siteId).get();
      if(s2.val()){data=s2.val();date=ld;}
    }
  }
  if(!data){
    document.getElementById("navName").textContent=siteId;
    document.getElementById("mainContent").innerHTML="<div class=\"no-data wrap\"><p>No test data found for <strong>"+e(siteId)+"</strong> on "+e(date)+".</p><br><a href=\"index.html\">Back to dashboard</a></div>";
    return;
  }
  renderSite(siteId,data,date);
  loadHistory(siteId);
}

function renderSite(id,d,date){
  document.title=(d.name||id)+" — QA Dashboard";
  document.getElementById("navName").textContent=d.name||id;
  const hasMajor=d.majorFailures&&d.majorFailures.length>0;
  const statusBadge=hasMajor
    ?"<span class=\"badge badge-fail\">&#10007; FAIL</span>"
    :"<span class=\"badge badge-pass\">&#10003; PASS</span>";
  document.getElementById("navStatus").innerHTML=statusBadge;

  const uiArr=d.uiChecks?Object.values(d.uiChecks):[];
  const chkMap=d.checks||{};
  const evArr=d.evidence?Object.values(d.evidence):[];
  const ai=d.aiAnalysis||null;
  const gh=d.githubRun||null;
  const pageUrls=d.pageUrls||{};

  // Counts
  const coreKeys=Object.keys(chkMap);
  const corePass=coreKeys.filter(k=>chkMap[k].pass).length;
  const uiPass=uiArr.filter(c=>c.pass).length;
  const uiFail=uiArr.filter(c=>!c.pass);
  const totalChks=coreKeys.length+uiArr.length;
  const totalPass=corePass+uiPass;
  const pct=totalChks?Math.round(totalPass/totalChks*100):0;

  let h="<div class=\"wrap\">";

  // Hero
  h+="<div class=\"hero\">";
  h+="<div class=\"hero-left\">";
  h+="<div class=\"hero-title\">"+e(d.name||id)+"</div>";
  h+="<div class=\"hero-url\"><a href=\""+e(d.url||"")+"\" target=\"_blank\">"+e(d.url||"")+"</a></div>";
  h+="<div class=\"hero-meta\">";
  if(d.runAt)h+="<span>&#128336; "+e(fmtDt(d.runAt))+"</span>";
  if(chkMap.loadTimeMs)h+="<span>&#9889; "+e(fmt(chkMap.loadTimeMs.value))+"</span>";
  if(chkMap.httpStatus)h+="<span>HTTP "+e(String(chkMap.httpStatus.value))+"</span>";
  if(gh)h+="<span><a href=\""+e(gh.runUrl)+"\" target=\"_blank\">GitHub Run #"+e(gh.runId)+"</a></span>";
  h+="</div></div>";
  h+="<div class=\"hero-right\">"+statusBadge;
  h+="<div style=\"font-size:11px;color:#4b5563\">"+totalPass+"/"+totalChks+" checks passing</div>";
  h+="</div></div>";

  // Stats
  h+="<div class=\"stat-row\">";
  const pr=pct;
  const prColor=pr>=80?"#4ade80":pr>=60?"#fbbf24":"#f87171";
  h+=statCard("Pass Rate",pr+"%",totalPass+"/"+totalChks+" checks",pr,prColor);
  h+=statCard("Core Checks",corePass+"/"+coreKeys.length,
    coreKeys.length&&corePass===coreKeys.length?"all clear":(coreKeys.length-corePass)+" failing",
    coreKeys.length?Math.round(corePass/coreKeys.length*100):0,"#4ade80");
  h+=statCard("UI Checks",uiPass+"/"+uiArr.length,
    uiFail.length+" failing",
    uiArr.length?Math.round(uiPass/uiArr.length*100):0,"#818cf8");
  h+=statCard("Issues",uiFail.length,
    uiFail.length===0?"all clear":"failing checks",
    uiFail.length===0?100:0,"#f87171");
  h+=statCard("Run Date",date,d.runAt?fmtDt(d.runAt).split(",").pop().trim():"",100,"#60a5fa");
  h+="</div>";

  // Issues panel (only failing UI checks)
  if(uiFail.length>0){
    h+="<div class=\"issues-panel\">";
    h+="<div class=\"issues-title\">&#9888; "+uiFail.length+" Issue"+(uiFail.length>1?"s":"")+" Found</div>";
    uiFail.forEach(function(c){
      // Try to find URL for this check
      let url="";
      const nm=(c.name||"").toLowerCase();
      if(nm.indexOf("search")>-1)url=d.url||"";
      else if(nm.indexOf("donate")>-1||nm.indexOf("checkout")>-1)url=pageUrls.donate||pageUrls.checkout||"";
      else if(nm.indexOf("mobile")>-1)url=d.url||"";
      h+=issueRow(c.name+(c.detail?" — "+c.detail:""),url);
    });
    h+="</div>";
  }

  // Major failures panel
  if(hasMajor){
    h+="<div class=\"issues-panel\">";
    h+="<div class=\"issues-title\">&#128308; "+d.majorFailures.length+" Major Failure"+(d.majorFailures.length>1?"s":"")+"</div>";
    d.majorFailures.forEach(function(f){h+=issueRow(f,d.url||"");});
    h+="</div>";
  }

  // Pages Tested
  const pageKeys=Object.keys(pageUrls);
  if(pageKeys.length>0){
    h+="<div class=\"section\">";
    h+="<div class=\"section-hdr\"><div class=\"section-title\">Pages Tested</div><span class=\"badge badge-info\">"+pageKeys.length+" pages</span></div>";
    h+="<div class=\"section-body\"><div class=\"pages-row\">";
    pageKeys.forEach(function(k){
      const u=pageUrls[k];
      h+="<div class=\"page-pill\"><a href=\""+e(u)+"\" target=\"_blank\">"+e(k)+"</a></div>";
    });
    h+="</div></div></div>";
  }

  // Core Checks
  if(coreKeys.length>0){
    h+="<div class=\"section\">";
    h+="<div class=\"section-hdr\"><div class=\"section-title\">Core Checks</div><span class=\"badge "+(corePass===coreKeys.length?"badge-pass":"badge-fail")+"\">"+corePass+"/"+coreKeys.length+"</span></div>";
    h+="<div class=\"section-body\">";
    const lblMap={httpStatus:"HTTP Status",pageTitle:"Page Title",hasContent:"Page Content",noErrorContent:"No Error Text",h1Content:"H1 Heading",hasInteractiveElements:"Interactive Elements",hasFundraisingContent:"Fundraising Content",loadTimeMs:"Load Time",hasNavigation:"Navigation"};
    coreKeys.forEach(function(k){
      const c=chkMap[k];
      const lbl=lblMap[k]||k;
      let detail="";
      if(k==="loadTimeMs")detail=fmt(c.value);
      else if(k==="httpStatus")detail="HTTP "+c.value;
      else if(c.value!==undefined&&c.value!==null)detail=String(c.value).slice(0,60);
      h+=checkItem(lbl,detail,c.pass,c.pass?"":(d.url||""));
    });
    h+="</div></div>";
  }

  // UI Checks (all)
  if(uiArr.length>0){
    const coreUI=uiArr.filter(function(c){return !c.name.startsWith("[");});
    const extraUI=uiArr.filter(function(c){return c.name.startsWith("[");});

    if(coreUI.length>0){
      const coreUIPass=coreUI.filter(function(c){return c.pass;}).length;
      h+="<div class=\"section\">";
      h+="<div class=\"section-hdr\"><div class=\"section-title\">UI &amp; Content Checks</div><span class=\"badge "+(coreUIPass===coreUI.length?"badge-pass":"badge-warn")+"\">"+coreUIPass+"/"+coreUI.length+"</span></div>";
      h+="<div class=\"section-body\">";
      coreUI.forEach(function(c){
        // Get URL for this check
        const nm=c.name.toLowerCase();
        let url=d.url||"";
        if(nm.indexOf("donate")>-1||nm.indexOf("checkout")>-1)url=pageUrls.donate||pageUrls.checkout||d.url||"";
        h+=checkItem(c.name,c.detail||"",c.pass,c.pass?"":url);
      });
      h+="</div></div>";
    }

    if(extraUI.length>0){
      const extraUIPass=extraUI.filter(function(c){return c.pass;}).length;
      h+="<div class=\"section\">";
      h+="<div class=\"section-hdr\"><div class=\"section-title\">Mobile, Desktop &amp; Search Checks</div><span class=\"badge "+(extraUIPass===extraUI.length?"badge-pass":"badge-warn")+"\">"+extraUIPass+"/"+extraUI.length+"</span></div>";
      h+="<div class=\"section-body\">";
      extraUI.forEach(function(c){
        let url=d.url||"";
        const nm=c.name.toLowerCase();
        if(nm.indexOf("search")>-1)url=d.url||"";
        h+=checkItem(c.name,c.detail||"",c.pass,c.pass?"":url);
      });
      h+="</div></div>";
    }
  }

  // AI Analysis
  if(ai){
    h+="<div class=\"section\">";
    h+="<div class=\"section-hdr\"><div class=\"section-title\">AI Visual Analysis</div><span class=\"badge "+(ai.passing?"badge-pass":"badge-fail")+"\">"+(ai.passing?"Passing":"Issues found")+"</span></div>";
    h+="<div class=\"section-body\"><div class=\"ai-block\">";
    h+="<div class=\"ai-lbl\">&#129302; AI Assessment</div>";
    if(ai.pageDescription)h+="<div class=\"ai-desc\">"+e(ai.pageDescription)+"</div>";
    if(ai.visualChecks&&ai.visualChecks.length>0){
      ai.visualChecks.forEach(function(vc){
        const ico=vc.pass
          ?"<div class=\"ai-ri ci-pass\">&#10003;</div>"
          :"<div class=\"ai-ri ci-fail\">&#10007;</div>";
        h+="<div class=\"ai-row\">"+ico
          +"<div class=\"ai-rn\">"+e(vc.item||"")+"</div>"
          +"<div class=\"ai-rno\">"+e(vc.note||"")+"</div>"
          +"</div>";
      });
    }
    h+="</div></div></div>";
  }

  // Screenshots
  if(evArr.length>0){
    h+="<div class=\"section\">";
    h+="<div class=\"section-hdr\"><div class=\"section-title\">Screenshots</div><span class=\"badge badge-info\">"+evArr.length+"</span></div>";
    h+="<div class=\"section-body\"><div class=\"ss-grid\">";
    evArr.forEach(function(ev){
      const src="data:image/jpeg;base64,"+ev.screenshot;
      const urlLink=ev.url?"<a href=\""+e(ev.url)+"\" target=\"_blank\">"+e(ev.url)+"</a>":"";
      h+="<div class=\"ss-card\" onclick=\"openLightbox('"+src.slice(0,30)+"')\">";
      h+="<div class=\"ss-lbl\">"+e(ev.label||"Screenshot")+(urlLink?" &bull; "+urlLink:"")+"</div>";
      h+="<img class=\"ss-img\" src=\""+src+"\" alt=\""+e(ev.label||"Screenshot")+"\" onclick=\"event.stopPropagation();openLightbox(this.src)\">";
      h+="</div>";
    });
    h+="</div></div></div>";
  }

  // History placeholder
  h+="<div class=\"section\">";
  h+="<div class=\"section-hdr\"><div class=\"section-title\">Recent Runs</div></div>";
  h+="<div class=\"section-body\" id=\"histBody\"><div style=\"color:#4b5563;font-size:12px\">Loading history&#8230;</div></div>";
  h+="</div>";

  h+="</div>"; // end .wrap
  document.getElementById("mainContent").innerHTML=h;
}

async function loadHistory(id){
  const sn=await db.ref("autoSummary").limitToLast(14).get();
  const data=sn.val()||{};
  const rows=Object.entries(data).reverse();
  const el=document.getElementById("histBody");
  if(!el)return;
  if(rows.length===0){el.innerHTML="<div style=\"color:#4b5563;font-size:12px\">No history yet</div>";return;}
  let hh="";
  rows.forEach(function(kv){
    const dt=kv[0];const s=kv[1];
    const pass=s.passed||0;const tot=s.totalSites||20;
    const pct=Math.round(pass/tot*100);
    hh+="<div class=\"hist-item\" onclick=\"window.location.href='site.html?id="+id+"&date="+dt+"'\">";
    hh+="<div class=\"hist-date\">"+e(dt)+"</div>";
    hh+="<div class=\"hist-bar\">";
    hh+="<div style=\"width:"+pct+"%;background:#4ade8030;height:100%\"></div>";
    hh+="<div style=\"width:"+(100-pct)+"%;background:"+(100-pct>0?"#f8717130":"#1e1e2e")+";height:100%\"></div>";
    hh+="</div>";
    hh+="<span class=\"badge "+(s.failed?"badge-fail":"badge-pass")+"\">"+(s.failed?s.failed+" failed":"All passed")+"</span>";
    hh+="</div>";
  });
  el.innerHTML=hh;
}

loadSite();
</script>
</body>
</html>
