<style>
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f5f6fa;color:#111827;font-family:Inter,system-ui,sans-serif;font-size:13px;min-height:100vh;line-height:1.5}

.task-prio-low{background:#ede9fe;color:#7c3aed;font-size:9px;font-weight:700;padding:2px 7px;border-radius:8px}

.task-status-done{background:#dcfce7;color:#16a34a;font-size:9px;font-weight:700;padding:2px 7px;border-radius:8px}
.done-btn{background:transparent;border:1px solid #d1d5db;border-radius:5px;padding:3px 8px;font-size:9px;font-family:inherit;color:#6b7280;cursor:pointer}
.done-btn:hover{border-color:#16a34a;color:#16a34a;background:#f0fdf4}
.qa-teach-panel{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:16px 18px;margin-bottom:16px}
.qa-teach-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;flex-wrap:wrap;gap:8px}
.qa-teach-title{color:#92400e;font-weight:700;font-size:13px;display:flex;align-items:center;gap:7px}
.qa-teach-sub{color:#78350f;font-size:11px;margin-bottom:12px;line-height:1.5}
.qa-teach-toggle{background:#fff;border:1px solid #fde68a;border-radius:6px;padding:4px 10px;font-size:11px;font-family:inherit;color:#92400e;cursor:pointer}
.qa-teach-toggle:hover{background:#fef3c7}
.qa-teach-body{display:none}
.qa-teach-body.open{display:block}
.fb-item{background:#fff;border:1px solid #fde68a;border-radius:8px;padding:12px 14px;margin-bottom:8px}
.fb-item-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:5px}
.fb-check-name{font-weight:600;font-size:12px;color:#111827}
.fb-type{font-size:9px;font-weight:700;padding:2px 7px;border-radius:8px}
.ft-fp{background:#fef3c7;color:#d97706}
.ft-missed{background:#fee2e2;color:#ef4444}
.ft-flow{background:#ede9fe;color:#7c3aed}
.fb-note{font-size:11px;color:#6b7280;line-height:1.5}
.fb-meta{font-size:10px;color:#9ca3af;margin-top:4px}
.teach-type-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tt-tab{background:#fff;border:1px solid #fde68a;border-radius:6px;padding:5px 11px;font-size:11px;font-family:inherit;color:#92400e;cursor:pointer;transition:all .15s}
.tt-tab.active{background:#f59e0b;border-color:#f59e0b;color:#fff;font-weight:600}
.tt-tab:hover:not(.active){background:#fef3c7}
.ss-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.ss-card{background:#fff;border:1px solid #e5e7eb;border-radius:8px;overflow:hidden;cursor:pointer;transition:box-shadow .15s}
.ss-card:hover{box-shadow:0 2px 12px rgba(0,0,0,.08)}
.ss-lbl{padding:8px 12px;font-size:11px;color:#6b7280;border-bottom:1px solid #f3f4f6;display:flex;align-items:center;justify-content:space-between;background:#fafafa}
.ss-img{width:100%;display:block;max-height:180px;object-fit:cover;object-position:top}
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:200;align-items:center;justify-content:center;cursor:zoom-out;padding:20px}
.lightbox.open{display:flex}
.lightbox img{max-width:90vw;max-height:90vh;border-radius:6px;object-fit:contain}
.ai-block{background:#f8f7ff;border:1px solid #ede9fe;border-radius:8px;padding:14px 16px}
.ai-lbl{color:#7c3aed;font-size:10px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;font-weight:600}
.ai-desc{font-size:12px;color:#374151;line-height:1.7;margin-bottom:10px}
.ai-row{display:flex;align-items:flex-start;gap:8px;font-size:11px;padding:5px 0;border-bottom:1px solid #ede9fe}
.ai-row:last-child{border:none}
.ai-ri{flex-shrink:0;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;margin-top:1px}
.ai-rn{width:180px;flex-shrink:0;color:#374151}
.ai-rno{flex:1;color:#6b7280;line-height:1.4}
.pages-row{display:flex;flex-wrap:wrap;gap:8px}
.page-pill{background:#f3f4f6;border:1px solid #e5e7eb;border-radius:20px;padding:5px 12px;font-size:11px;color:#374151}
.page-pill:hover{background:#ede9fe}
.hist-item{display:flex;align-items:center;gap:12px;padding:9px 6px;border-bottom:1px solid #f3f4f6;font-size:11px;cursor:pointer;border-radius:6px;transition:background .1s}
.hist-item:last-child{border:none}
.hist-item:hover{background:#f9fafb}
.hist-date{color:#6b7280;width:85px;flex-shrink:0}
.hist-bar{flex:1;background:#f3f4f6;border-radius:2px;height:4px;overflow:hidden;display:flex}
.spinner{width:32px;height:32px;border:2px solid #e5e7eb;border-top-color:#4f46e5;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.no-data{text-align:center;padding:60px 20px;color:#9ca3af}
.copy-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:8px 18px;border-radius:8px;font-size:12px;font-weight:500;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none}
.copy-toast.show{opacity:1}
@media(max-width:640px){.hero{flex-direction:column}.hero-right{align-items:flex-start}.stat-row{grid-template-columns:repeat(2,1fr)}.ss-grid{grid-template-columns:1fr}.wrap{padding:16px 14px 40px}.form-row{grid-template-columns:1fr}.ai-rn{width:120px}}
</style>
</head>
<body>
<div id="authGate" class="auth-gate">
  <div class="auth-box">
    <div class="auth-logo">&#128274; QA Dashboard</div>
    <div class="auth-sub">Lev Charity QA team access.</div>
    <label class="auth-label">Username / Email</label>
    <input type="text" class="auth-input" id="authUser" placeholder="your@email.com" autocomplete="username" />
    <label class="auth-label">Password</label>
    <input type="password" class="auth-input" id="authPass" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()" />
    <button class="auth-btn" onclick="doLogin()">Log in</button>
    <div class="auth-err" id="authErr">Incorrect credentials. Please try again.</div>
  </div>
</div>
<div class="modal-bg" id="taskModal" onclick="if(event.target===this)closeModal('taskModal')">
  <div class="modal">
    <div class="modal-head">
      <div><div class="modal-title">&#10010; Create Task</div><div class="modal-sub" id="taskModalSub">Action item from QA findings</div></div>
      <button class="modal-close" onclick="closeModal('taskModal')">&#10005;</button>
    </div>
    <div class="form-group"><label class="form-label">Task Title</label><input type="text" class="form-input" id="taskTitle" placeholder="e.g. Fix broken donate button on mobile" /></div>
    <div class="form-group"><label class="form-label">What to fix</label><textarea class="form-textarea" id="taskDesc" placeholder="Describe the issue and steps to resolve it..."></textarea></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Priority</label><select class="form-select" id="taskPriority"><option value="high">High</option><option value="medium" selected>Medium</option><option value="low">Low</option></select></div>
      <div class="form-group"><label class="form-label">Assigned to</label><input type="text" class="form-input" id="taskAssignee" placeholder="e.g. Dev Team" /></div>
    </div>
    <div class="form-group"><label class="form-label">Affected URL</label><input type="text" class="form-input" id="taskUrl" placeholder="https://..." /></div>
    <div class="form-saved" id="taskSaved">&#10003; Task saved!</div>
    <button class="submit-btn" onclick="submitTask()">Save Task</button>
  </div>
</div>
<div class="modal-bg" id="feedbackModal" onclick="if(event.target===this)closeModal('feedbackModal')">
  <div class="modal">
    <div class="modal-head">
      <div><div class="modal-title">&#129302; Teach the QA Agent</div><div class="modal-sub" id="feedbackModalSub">Flag an issue or expand QA coverage</div></div>
      <button class="modal-close" onclick="closeModal('feedbackModal')">&#10005;</button>
    </div>
    <div class="form-group"><label class="form-label">Check / Issue Name</label><input type="text" class="form-input" id="fbCheckName" placeholder="e.g. Mobile nav menu" /></div>
    <div class="form-group"><label class="form-label">Type of Feedback</label>
      <div class="teach-type-tabs" id="fbTypeTabs">
        <button class="tt-tab active" data-type="false_positive" onclick="setFbType(this)">&#9888; False Positive</button>
        <button class="tt-tab" data-type="missed_issue" onclick="setFbType(this)">&#10007; Missed Issue</button>
        <button class="tt-tab" data-type="expand_test" onclick="setFbType(this)">&#43; Expand Test</button>
        <button class="tt-tab" data-type="correct" onclick="setFbType(this)">&#10003; Confirm Correct</button>
      </div>
    </div>
    <div class="form-group"><label class="form-label" id="fbNoteLabel">Why is this a false positive?</label><textarea class="form-textarea" id="fbNote" placeholder="Explain what the QA agent got wrong, or what it should check instead..."></textarea></div>
    <div class="form-group"><label class="form-label">Expected Behaviour (optional)</label><input type="text" class="form-input" id="fbExpected" placeholder="What should the correct QA result be?" /></div>
    <div class="form-saved" id="feedbackSaved">&#10003; Feedback saved! The QA agent will learn from this.</div>
    <button class="submit-btn amber" onclick="submitFeedback()">Send to QA Agent</button>
  </div>
</div>
<div id="mainContent"><div style="display:flex;align-items:center;justify-content:center;min-height:60vh;flex-direction:column;gap:12px;color:#9ca3af"><div class="spinner"></div><span>Loading...</span></div></div>
<div class="lightbox" id="lightbox" onclick="this.classList.remove('open')"><img id="lbImg" src="" alt="Screenshot"></div>
<div class="copy-toast" id="copyToast">&#128279; URL copied to clipboard!</div>
<script>
firebase.initializeApp({databaseURL:"https://qa-tracker-73b87-default-rtdb.firebaseio.com"});
const db=firebase.database();
const AUTH_KEY='qa_auth_v1';
const AUTH_USER_KEY='qa_auth_user';
const VALID_USERS=[
  {u:'hanna@levcharity.com',p:'LevQA2025!'},
  {u:'alisa@levcharity.com',p:'LevQA2025!'},
  {u:'sona@levcharity.com',p:'LevQA2025!'},
  {u:'yervand@leverage.it',p:'LevQA2025!'},
  {u:'aviva@leverage.it',p:'LevQA2025!'},
  {u:'meir@leverage.it',p:'Meir2025'},
  {u:'admin',p:'LevQA2025!'}
];
function checkAuth(){return sessionStorage.getItem(AUTH_KEY)==='ok';}
function currentUser(){return sessionStorage.getItem(AUTH_USER_KEY)||'team';}
function doLogin(){
  const u=document.getElementById('authUser').value.trim();
  const p=document.getElementById('authPass').value;
  if(VALID_USERS.some(x=>x.u===u&&x.p===p)){
    sessionStorage.setItem(AUTH_KEY,'ok');
    sessionStorage.setItem(AUTH_USER_KEY,u);
    document.getElementById('authGate').style.display='none';
    initSite();
  } else {
    document.getElementById('authErr').style.display='block';
    document.getElementById('authPass').value='';
  }
}
if(checkAuth()){document.getElementById('authGate').style.display='none';initSite();}
const params=new URLSearchParams(location.search);
const siteId=params.get('id')||params.get('site')||'';
const dateParam=params.get('date')||'';
const testType=params.get('type')||'smoke';
let currentSiteName=siteId;
function goBack(){window.location.href='index.html'+(dateParam?'?date='+encodeURIComponent(dateParam):'');}
function e(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmt(ms){return ms>=1000?(ms/1000).toFixed(1)+'s':ms+'ms';}
function fmtDt(ts){try{return new Date(ts).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}catch(x){return ts;}}
function copyUrl(){
  navigator.clipboard.writeText(location.href).then(()=>{
    const t=document.getElementById('copyToast');
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),2200);
  });
}
function openLightbox(src){document.getElementById('lbImg').src=src;document.getElementById('lightbox').classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
let _taskCtx={};
function openTaskModal(btn){
  const title=btn.getAttribute('data-title')||'';
  const url=btn.getAttribute('data-url')||'';
  const fix=btn.getAttribute('data-fix')||'';
  document.getElementById('taskTitle').value=title;
  document.getElementById('taskDesc').value=fix;
  document.getElementById('taskUrl').value=url;
  document.getElementById('taskAssignee').value='';
  document.getElementById('taskPriority').value='medium';
  document.getElementById('taskSaved').style.display='none';
  document.getElementById('taskModalSub').textContent=currentSiteName+(dateParam?' · '+dateParam:'');
  _taskCtx={title,url,fix,site:siteId,siteName:currentSiteName,date:dateParam};
  document.getElementById('taskModal').classList.add('open');
}
async function submitTask(){
  const task={title:document.getElementById('taskTitle').value||_taskCtx.title,description:document.getElementById('taskDesc').value,priority:document.getElementById('taskPriority').value,assignee:document.getElementById('taskAssignee').value,url:document.getElementById('taskUrl').value,site:_taskCtx.site,siteName:_taskCtx.siteName,date:_taskCtx.date,status:'open',createdBy:currentUser(),createdAt:new Date().toISOString()};
  try{await db.ref('tasks/'+_taskCtx.site).push(task);document.getElementById('taskSaved').style.display='block';setTimeout(()=>{closeModal('taskModal');loadTasks(siteId);},1500);}catch(err){alert('Error: '+err.message);}
}
async function markTaskDone(siteKey,taskKey){
  try{await db.ref('tasks/'+siteKey+'/'+taskKey+'/status').set('done');loadTasks(siteId);}catch(err){alert(err.message);}
}
let _fbType='false_positive';
function openFeedbackModal(checkName){
  document.getElementById('fbCheckName').value=checkName||'';
  document.getElementById('fbNote').value='';
  document.getElementById('fbExpected').value='';
  document.getElementById('feedbackSaved').style.display='none';
  const firstTab=document.querySelector('.tt-tab');
  if(firstTab){_fbType='false_positive';document.querySelectorAll('.tt-tab').forEach(t=>t.classList.remove('active'));firstTab.classList.add('active');}
  document.getElementById('fbNoteLabel').textContent='Why is this a false positive? What did the agent get wrong?';
  document.getElementById('feedbackModalSub').textContent=(checkName?checkName+' · ':'')+currentSiteName;
  document.getElementById('feedbackModal').classList.add('open');
}
function setFbType(btn){
  _fbType=btn.getAttribute('data-type');
  document.querySelectorAll('.tt-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  const labels={false_positive:'Why is this a false positive? What did the agent get wrong?',missed_issue:'Describe the issue the agent missed. What should it check?',expand_test:'What new check or flow should be added to the QA tests?',correct:'Any additional notes on this correct result?'};
  document.getElementById('fbNoteLabel').textContent=labels[_fbType]||'Notes';
}
async function submitFeedback(){
  const fb={site:siteId,siteName:currentSiteName,date:dateParam,checkName:document.getElementById('fbCheckName').value,type:_fbType,note:document.getElementById('fbNote').value,expected:document.getElementById('fbExpected').value,reportedBy:currentUser(),createdAt:new Date().toISOString(),status:'open'};
  try{await db.ref('qaFeedback/'+siteId).push(fb);document.getElementById('feedbackSaved').style.display='block';setTimeout(()=>{closeModal('feedbackModal');loadFeedback(siteId);},1600);}catch(err){alert('Error: '+err.message);}
}
function statCard(lbl,val,sub,pct,col){const w=Math.min(100,Math.max(0,pct||0));return '<div class="stat-card"><div class="stat-label">'+e(lbl)+'</div><div class="stat-value" style="color:'+col+'">'+e(String(val))+'</div><div class="stat-sub">'+e(String(sub||''))+'</div><div class="stat-bar"><div class="stat-bar-fill" style="width:'+w+'%;background:'+col+'40"></div></div></div>';}
function checkItem(name,detail,pass,url){
  const icon=pass?'<div class="check-icon ci-pass">&#10003;</div>':'<div class="check-icon ci-fail">&#10007;</div>';
  const urlHtml=url?'<a class="check-url-lnk" href="'+e(url)+'" target="_blank">'+e(url)+'</a>':'';
  const safeName=name.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  const fpBtn='<button class="fp-flag-btn" onclick="openFeedbackModal(\''+safeName+'\')">&#9873; Teach agent</button>';
  return '<div class="check-item">'+icon+'<div class="check-name">'+e(name)+'</div><div class="check-detail">'+e(detail)+(urlHtml?'<br>'+urlHtml:'')+'</div>'+fpBtn+'</div>';
}
function getFixAdvice(n){
  n=(n||'').toLowerCase();
  if(n.includes('load time')||n.includes('loadtime'))return'Optimise images, enable browser caching, minify JS/CSS, consider a CDN. Target under 3 seconds.';
  if(n.includes('donate')||n.includes('donation'))return'Test the donation flow end-to-end. Verify the payment gateway is configured and the donate button links to the correct URL.';
  if(n.includes('mobile'))return'Review responsive CSS breakpoints. Test on real mobile devices. Check font sizes, button tap targets, and horizontal overflow.';
  if(n.includes('search'))return'Verify the search index is populated and the search API returns results. Check for JS console errors on the search page.';
  if(n.includes('header'))return'Inspect the header component for broken links, missing logo, or navigation menu issues.';
  if(n.includes('http')||n.includes('status'))return'Ensure the server returns HTTP 200. Check for SSL certificate issues or firewall rules.';
  if(n.includes('content')||n.includes('text'))return'Check the CMS or database for missing content. Ensure all required text blocks and images are populated.';
  if(n.includes('interactive')||n.includes('button'))return'Inspect all buttons and links for broken href attributes or JS errors. Verify forms submit correctly.';
  if(n.includes('fundrais'))return'Verify fundraising widgets are embedded and loading. Check third-party fundraising platform status.';
  if(n.includes('title'))return'Update the page title tag in the CMS or HTML to include relevant keywords and the organisation name.';
  if(n.includes('checkout'))return'Test the full checkout flow. Look for JS errors or broken payment integrations.';
  return'Investigate the specific check failure. Review the affected page and fix the identified issue, then re-run QA to confirm resolution.';
}
async function initSite(){
  if(!siteId){document.getElementById('mainContent').innerHTML='<div class="no-data wrap">No site ID provided. <a href="index.html">Back to dashboard</a></div>';return;}
  let date=dateParam;
  if(!date){const sn=await db.ref('autoLatest').get();date=(sn.val()||{}).date||new Date().toISOString().split('T')[0];}
  const path=testType==='flow'?'flowResults':'autoResults';
  const sn=await db.ref(path+'/'+date+'/'+siteId).get();
  let data=sn.val();
  if(!data&&testType==='smoke'){const ls=await db.ref('autoLatest').get();const ld=(ls.val()||{}).date;if(ld&&ld!==date){const s2=await db.ref('autoResults/'+ld+'/'+siteId).get();if(s2.val()){data=s2.val();}}}
  if(!data){document.getElementById('mainContent').innerHTML='<div class="no-data wrap" style="padding-top:80px"><p style="font-size:16px;font-weight:600;color:#374151;margin-bottom:8px">No data found</p><p style="color:#9ca3af;margin-bottom:16px">No test data for <strong>'+e(siteId)+'</strong> on '+e(date)+'.</p><a href="index.html" style="color:#4f46e5;font-weight:500">&#8592; Back to dashboard</a></div>';return;}
  renderSite(siteId,data,date);
  loadTasks(siteId);
  loadHistory(siteId);
  loadFeedback(siteId);
}
function renderSite(id,d,date){
  document.title=(d.name||id)+' — QA Dashboard';
  currentSiteName=d.name||id;
  const hasMajor=d.majorFailures&&d.majorFailures.length>0;
  const statusBadge=hasMajor?'<span class="badge badge-fail">&#10007; FAIL</span>':'<span class="badge badge-pass">&#10003; PASS</span>';
  const topnav='<nav class="topnav"><button class="back-btn" onclick="goBack()"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg> All Sites</button><div class="nav-title">'+e(d.name||id)+'</div><div class="nav-status"><button class="share-btn" onclick="copyUrl()">&#128279; Copy link</button>'+statusBadge+'</div></nav>';
  const uiArr=d.uiChecks?Object.values(d.uiChecks):[];
  const chkMap=d.checks||{};
  const evArr=d.evidence?Object.values(d.evidence):[];
  const ai=d.aiAnalysis||null;
  const gh=d.githubRun||null;
  const pageUrls=d.pageUrls||{};
  const coreKeys=Object.keys(chkMap);
  const corePass=coreKeys.filter(k=>chkMap[k].pass).length;
  const uiPass=uiArr.filter(c=>c.pass).length;
  const uiFail=uiArr.filter(c=>!c.pass);
  const totalChks=coreKeys.length+uiArr.length;
  const totalPass=corePass+uiPass;
  const pct=totalChks?Math.round(totalPass/totalChks*100):0;
  let h=topnav+'<div class="wrap">';
  h+='<div class="hero"><div class="hero-left"><div class="hero-title">'+e(d.name||id)+'</div><div class="hero-url"><a href="'+e(d.url||'')+'" target="_blank">'+e(d.url||'')+'</a></div><div class="hero-meta">';
  if(d.runAt)h+='<span>&#128336; '+e(fmtDt(d.runAt))+'</span>';
  if(chkMap.loadTimeMs)h+='<span>&#9889; '+e(fmt(chkMap.loadTimeMs.value))+'</span>';
  if(chkMap.httpStatus)h+='<span>HTTP '+e(String(chkMap.httpStatus.value))+'</span>';
  if(gh)h+='<span><a href="'+e(gh.runUrl)+'" target="_blank">GitHub Run #'+e(gh.runId)+'</a></span>';
  h+='</div></div><div class="hero-right">'+statusBadge+'<div class="url-chip" onclick="copyUrl()" title="Click to copy unique link to this report">&#128279; site.html?id='+e(id)+(date?'&amp;date='+e(date):'')+'</div><div style="font-size:11px;color:#9ca3af">'+totalPass+'/'+totalChks+' checks passing</div></div></div>';
  const prColor=pct>=80?'#16a34a':pct>=60?'#d97706':'#ef4444';
  h+='<div class="stat-row">';
  h+=statCard('Pass Rate',pct+'%',totalPass+'/'+totalChks+' checks',pct,prColor);
  h+=statCard('Core Checks',corePass+'/'+coreKeys.length,coreKeys.length&&corePass===coreKeys.length?'all clear':(coreKeys.length-corePass)+' failing',coreKeys.length?Math.round(corePass/coreKeys.length*100):0,'#16a34a');
  h+=statCard('UI Checks',uiPass+'/'+uiArr.length,uiFail.length+' failing',uiArr.length?Math.round(uiPass/uiArr.length*100):0,'#7c3aed');
  h+=statCard('Issues',uiFail.length,uiFail.length===0?'all clear':'need attention',uiFail.length===0?100:0,'#ef4444');
  h+=statCard('Run Date',date,d.runAt?fmtDt(d.runAt).split(',').pop().trim():'',100,'#4f46e5');
  h+='</div>';
  function issueRowFn(text,url,fixText){
    const lnk=url?'<a class="issue-lnk" href="'+e(url)+'" target="_blank">'+e(url)+'</a>':'';
    const fix=fixText?'<div class="issue-fix">&#128295; <strong>How to fix:</strong> '+e(fixText)+'</div>':'';
    const safeT=e(text);const safeU=e(url||'');const safeF=e(fixText||'');
    const safeTQ=text.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    return '<div class="issue-row"><span class="issue-arr">&#8594;</span><div class="issue-body"><div class="issue-text">'+safeT+'</div>'+lnk+fix+'<button class="task-btn" data-title="'+safeT+'" data-url="'+safeU+'" data-fix="'+safeF+'" onclick="openTaskModal(this)">&#10010; Create Task</button><button class="fp-issue-btn" onclick="openFeedbackModal(\''+safeTQ+'\'))">&#9873; Not an issue?</button></div></div>';
  }
  if(uiFail.length>0){
    h+='<div class="issues-panel"><div class="issues-title"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> '+uiFail.length+' Issue'+(uiFail.length>1?'s':'')+' Found — Actionable List</div>';
    uiFail.forEach(function(c){let url='';const nm=(c.name||'').toLowerCase();if(nm.includes('search'))url=d.url||'';else if(nm.includes('donate')||nm.includes('checkout'))url=pageUrls.donate||pageUrls.checkout||'';else url=d.url||'';h+=issueRowFn(c.name+(c.detail?' — '+c.detail:''),url,getFixAdvice(c.name));});
    h+='</div>';
  }
  if(hasMajor){
    h+='<div class="issues-panel" style="background:#fff5f5;border-color:#fca5a5"><div class="issues-title" style="color:#dc2626">&#128308; '+d.majorFailures.length+' Major Failure'+(d.majorFailures.length>1?'s':'')+'</div>';
    d.majorFailures.forEach(function(f){h+=issueRowFn(f,d.url||'',getFixAdvice(f));});
    h+='</div>';
  }
  h+='<div id="tasksSection"></div>';
  h+='<div id="feedbackSection"></div>';
  const pageKeys=Object.keys(pageUrls);
  if(pageKeys.length>0){h+='<div class="section"><div class="section-hdr"><div class="section-title">Pages Tested</div><span class="badge badge-info">'+pageKeys.length+' pages</span></div><div class="section-body"><div class="pages-row">';pageKeys.forEach(function(k){h+='<div class="page-pill"><a href="'+e(pageUrls[k])+'" target="_blank">'+e(k)+'</a></div>';});h+='</div></div></div>';}
  if(coreKeys.length>0){
    const lblMap={httpStatus:'HTTP Status',pageTitle:'Page Title',hasContent:'Page Content',noErrorContent:'No Error Text',h1Content:'H1 Heading',hasInteractiveElements:'Interactive Elements',hasFundraisingContent:'Fundraising Content',loadTimeMs:'Load Time',hasNavigation:'Navigation'};
    h+='<div class="section"><div class="section-hdr"><div class="section-title">Core Checks</div><span class="badge '+(corePass===coreKeys.length?'badge-pass':'badge-fail')+'">'+corePass+'/'+coreKeys.length+'</span></div><div class="section-body">';
    coreKeys.forEach(function(k){const c=chkMap[k];let detail='';if(k==='loadTimeMs')detail=fmt(c.value);else if(k==='httpStatus')detail='HTTP '+c.value;else if(c.value!==undefined&&c.value!==null)detail=String(c.value).slice(0,60);h+=checkItem(lblMap[k]||k,detail,c.pass,c.pass?'':(d.url||''));});
    h+='</div></div>';
  }
  if(uiArr.length>0){
    const coreUI=uiArr.filter(function(c){return!c.name.startsWith('[');});
    const extraUI=uiArr.filter(function(c){return c.name.startsWith('[');});
    if(coreUI.length>0){const cp=coreUI.filter(function(c){return c.pass;}).length;h+='<div class="section"><div class="section-hdr"><div class="section-title">UI &amp; Content Checks</div><span class="badge '+(cp===coreUI.length?'badge-pass':'badge-warn')+'">'+cp+'/'+coreUI.length+'</span></div><div class="section-body">';coreUI.forEach(function(c){const nm=c.name.toLowerCase();let url=d.url||'';if(nm.includes('donate')||nm.includes('checkout'))url=pageUrls.donate||pageUrls.checkout||d.url||'';h+=checkItem(c.name,c.detail||'',c.pass,c.pass?'':url);});h+='</div></div>';}
    if(extraUI.length>0){const ep=extraUI.filter(function(c){return c.pass;}).length;h+='<div class="section"><div class="section-hdr"><div class="section-title">Mobile, Desktop &amp; Search Checks</div><span class="badge '+(ep===extraUI.length?'badge-pass':'badge-warn')+'">'+ep+'/'+extraUI.length+'</span></div><div class="section-body">';extraUI.forEach(function(c){h+=checkItem(c.name,c.detail||'',c.pass,c.pass?'':(d.url||''));});h+='</div></div>';}
  }
  if(ai){h+='<div class="section"><div class="section-hdr"><div class="section-title">AI Visual Analysis</div><span class="badge '+(ai.passing?'badge-pass':'badge-fail')+'">'+(ai.passing?'Passing':'Issues found')+'</span></div><div class="section-body"><div class="ai-block"><div class="ai-lbl">&#129302; AI Assessment</div>';if(ai.pageDescription)h+='<div class="ai-desc">'+e(ai.pageDescription)+'</div>';if(ai.visualChecks&&ai.visualChecks.length>0){ai.visualChecks.forEach(function(vc){const ico=vc.pass?'<div class="ai-ri ci-pass">&#10003;</div>':'<div class="ai-ri ci-fail">&#10007;</div>';h+='<div class="ai-row">'+ico+'<div class="ai-rn">'+e(vc.item||'')+'</div><div class="ai-rno">'+e(vc.note||'')+'</div></div>';});}h+='</div></div></div>';}
  if(evArr.length>0){h+='<div class="section"><div class="section-hdr"><div class="section-title">Screenshots</div><span class="badge badge-info">'+evArr.length+'</span></div><div class="section-body"><div class="ss-grid">';evArr.forEach(function(ev){const src='data:image/jpeg;base64,'+ev.screenshot;const urlLink=ev.url?'<a href="'+e(ev.url)+'" target="_blank" style="font-size:10px;color:#4f46e5">'+e(ev.url)+'</a>':'';h+='<div class="ss-card"><div class="ss-lbl">'+e(ev.label||'Screenshot')+(urlLink?' &bull; '+urlLink:'')+'</div><img class="ss-img" src="'+src+'" alt="'+e(ev.label||'Screenshot')+'" onclick="openLightbox(this.src)"></div>';});h+='</div></div></div>';}
  h+='<div class="section"><div class="section-hdr"><div class="section-title">Recent Runs for '+e(d.name||id)+'</div></div><div class="section-body" id="histBody"><div style="color:#9ca3af;font-size:12px">Loading...</div></div></div>';
  h+='<div style="text-align:center;padding:16px 0 0"><button class="share-btn" onclick="copyUrl()" style="margin:0 auto;display:inline-flex">&#128279; Copy shareable link for this report</button></div>';
  h+='</div>';
  document.getElementById('mainContent').innerHTML=h;
}
async function loadTasks(id){
  const sn=await db.ref('tasks/'+id).get();const data=sn.val()||{};
  const tasks=Object.entries(data).map(([k,v])=>({id:k,...v})).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  const el=document.getElementById('tasksSection');if(!el)return;
  const open=tasks.filter(t=>t.status!=='done');
  const done=tasks.filter(t=>t.status==='done');
  if(tasks.length===0){el.innerHTML='';return;}
  let h='<div class="section"><div class="section-hdr"><div class="section-title">&#9989; Action Items ('+open.length+' open'+(done.length?' / '+done.length+' done':'')+')</div></div><div class="section-body">';
  [...open,...done].forEach(function(t){
    const prioClass=t.priority==='high'?'task-prio-high':t.priority==='low'?'task-prio-low':'task-prio-med';
    const statusClass=t.status==='done'?'task-status-done':'task-status-open';
    h+='<div class="task-item" style="'+(t.status==='done'?'opacity:.55':'')+'"><div class="task-item-head"><div><div class="task-item-title">'+e(t.title||'Untitled task')+'</div><div class="task-item-meta">'+(t.createdBy||'team')+' · '+(t.date||'')+(t.assignee?' · '+e(t.assignee):'')+'</div></div><div style="display:flex;gap:5px;flex-shrink:0;align-items:center"><span class="'+prioClass+'">'+e(t.priority||'medium')+'</span><span class="'+statusClass+'">'+e(t.status||'open')+'</span>'+(t.status!=='done'?'<button class="done-btn" onclick="markTaskDone(\''+e(id)+'\',\''+e(t.id)+'\')" >&#10003; Done</button>':'')+'</div></div>';
    if(t.description)h+='<div class="task-item-desc">'+e(t.description)+'</div>';
    if(t.url)h+='<div style="margin-top:5px"><a href="'+e(t.url)+'" target="_blank" style="font-size:10px;color:#4f46e5">'+e(t.url)+'</a></div>';
    h+='</div>';
  });
  h+='</div></div>';el.innerHTML=h;
}
async function loadFeedback(id){
  const sn=await db.ref('qaFeedback/'+id).get();
  const data=sn.val()||{};
  const items=Object.entries(data).map(([k,v])=>({id:k,...v})).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).slice(0,30);
  const el=document.getElementById('feedbackSection');if(!el)return;
  const typeLabel={false_positive:'&#9888; False Positive',missed_issue:'&#10007; Missed Issue',expand_test:'&#43; Expand Test',correct:'&#10003; Confirmed'};
  const typeClass={false_positive:'ft-fp',missed_issue:'ft-missed',expand_test:'ft-flow',correct:'ft-fp'};
  const openBody=items.length===0;
  let h='<div class="qa-teach-panel"><div class="qa-teach-header"><div class="qa-teach-title">&#129302; Teach the QA Agent <span class="badge badge-warn" style="font-size:9px;margin-left:4px">'+(items.length>0?items.length+' note'+(items.length>1?'s':''):'No notes yet')+'</span></div><button class="qa-teach-toggle" onclick="var b=document.getElementById(\'teachBody\');b.classList.toggle(\'open\');this.textContent=b.classList.contains(\'open\')?(\'Hide\'): (\'Show notes\')">'+(!openBody?'Show notes':'Hide')+'</button></div>';
  h+='<div class="qa-teach-sub">If the QA agent flags something incorrectly, misses a real issue, or you want to add new checks — tell it here. Your corrections are stored and reviewed when updating the agent.</div>';
  h+='<div id="teachBody" class="qa-teach-body'+(openBody?' open':'')+'"><div style="margin-bottom:10px"><button class="submit-btn amber" onclick="openFeedbackModal(\'\')" style="width:auto;padding:8px 16px;font-size:12px">&#129302; + Add teaching note</button></div>';
  if(items.length>0){
    items.forEach(function(fb){
      h+='<div class="fb-item"><div class="fb-item-head"><div class="fb-check-name">'+e(fb.checkName||'General feedback')+'</div><span class="fb-type '+typeClass[fb.type]+'">'+(typeLabel[fb.type]||fb.type)+'</span></div>';
      if(fb.note)h+='<div class="fb-note">'+e(fb.note)+'</div>';
      if(fb.expected)h+='<div class="fb-note" style="color:#4f46e5;margin-top:3px">Expected: '+e(fb.expected)+'</div>';
      h+='<div class="fb-meta">'+e(fb.reportedBy||'team')+' · '+e((fb.createdAt||'').slice(0,10))+'</div></div>';
    });
  }
  h+='</div></div>';
  el.innerHTML=h;
}
async function loadHistory(id){
  const sn=await db.ref('autoSummary').limitToLast(14).get();const data=sn.val()||{};
  const rows=Object.entries(data).reverse();const el=document.getElementById('histBody');if(!el)return;
  if(rows.length===0){el.innerHTML='<div style="color:#9ca3af;font-size:12px">No history yet</div>';return;}
  let hh='';
  rows.forEach(function(kv){
    const dt=kv[0];const s=kv[1];const pass=s.passed||0;const tot=s.totalSites||20;
    const pct=Math.round(pass/tot*100);
    const isActive=dt===dateParam;
    hh+='<div class="hist-item" '+(isActive?'style="background:#eef2ff;border-radius:6px"':'')+' onclick="window.location.href=\'site.html?id='+id+'&date='+"'+dt+'"+'\'"><div class="hist-date">'+e(dt)+'</div><div class="hist-bar"><div style="width:'+pct+'%;background:#22c55e40;height:100%"></div><div style="width:'+(100-pct)+'%;background:'+(100-pct>0?'#ef444430':'#f3f4f6')+';height:100%"></div></div><span class="badge '+(s.failed?'badge-fail':'badge-pass')+'">'+(s.failed?s.failed+' failed':'All passed')+'</span></div>';
  });
  el.innerHTML=hh;
}
</script>
</body>
</html>
